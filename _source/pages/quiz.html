<section class="article-head">
  <div class="wrap prose">
    <h1>Are you ready to move back home?</h1>
    <p class="lead">11 questions. About two minutes. Answer for where you are today, not where you plan to be.</p>
  </div>
</section>

<section style="padding-top: 0;">
  <div class="wrap">
    <form class="quiz" id="quiz" novalidate>
      <div class="progress" aria-hidden="true"><div class="fill" id="fill"></div></div>
      <p class="form-note" id="count" aria-live="polite">0 of 11 answered</p>
      <div id="questions"></div>
      <button class="btn" type="submit">See my score</button>
      <p class="form-note hidden" id="missing" role="alert"></p>
    </form>
    <div class="result quiz hidden" id="result" tabindex="-1" aria-live="polite"></div>
  </div>
</section>
